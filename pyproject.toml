# Deploy manifest for Vercel (zero-config FastAPI). Backend dev tooling lives in backend/pyproject.toml.
# Runtime dependencies must match backend/requirements.txt (CI checks this).
[project]
name = "wind-forecast-monitor"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[tool.vercel]
entrypoint = "api.index:app"

[tool.vercel.fastapi.static]
# Our request-logging middleware would otherwise keep the SPA inside the function.
cdn = true
# Keep the (~1 MB) build in the function too, so the StaticFiles mount still works as a fallback.
exclude = false
