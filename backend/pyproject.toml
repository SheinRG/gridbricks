# [project] is the manifest Vercel installs for the backend service.
# Runtime dependencies must match requirements.txt (Docker); CI checks this.
[project]
name = "wind-forecast-monitor"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.1",
    "pandas==3.1.0",
    "numpy==2.5.4",
    "tzdata==2026.5",
    "uvicorn==0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]
# DTZ flags naive datetimes, which this project bans.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
