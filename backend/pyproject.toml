[project]
name = "wind-forecast-monitor"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DTZ", "RUF"]
# DTZ flags naive datetimes, which this project bans.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
