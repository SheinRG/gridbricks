name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python ../scripts/check_deps_sync.py
      - run: ruff check . ../api ../scripts
      - run: ruff format --check . ../api ../scripts
      - run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --passWithNoTests
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t wind-forecast-monitor .
      - name: Smoke test the image (API + SPA from one container)
        run: |
          docker run -d --name app -p 8000:8000 wind-forecast-monitor
          for i in $(seq 1 30); do
            curl -fs localhost:8000/api/v1/health && break
            sleep 1
          done
          curl -fs localhost:8000/api/v1/health | grep -q '"data_loaded":true'
          curl -fs localhost:8000/api/v1/metrics | grep -q shortfall_buffer_mw
          curl -fs localhost:8000/ | grep -qi '<div id="root">'
      - if: failure()
        run: docker logs app
