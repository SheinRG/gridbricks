# Local development with hot reload on both sides. Frontend: http://localhost:5173
services:
  backend:
    image: python:3.12-slim
    working_dir: /srv/backend
    command: sh -c "pip install -q -r requirements.txt && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      WATCHFILES_FORCE_POLLING: "true" # reliable reload on Windows/macOS bind mounts
    volumes:
      - ./backend:/srv/backend
      - pip-cache:/root/.cache/pip
    ports:
      - "8000:8000"

  frontend:
    image: node:20-alpine
    working_dir: /srv/frontend
    command: sh -c "npm ci && npm run dev"
    environment:
      API_PROXY_TARGET: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/srv/frontend
      - /srv/frontend/node_modules # keep container deps separate from the host's
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pip-cache:
